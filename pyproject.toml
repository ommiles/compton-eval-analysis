[project]
name = "compton-eval-analysis"
version = "0.1.0"
description = "Statistical analysis for LLM summarization eval runs — bootstrap CIs, paired significance testing, judge reliability, and power analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "O.M. Miles" }]
keywords = ["llm-eval", "statistics", "bootstrap", "power-analysis", "rag"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
compton-eval = "compton_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compton_eval"]
